<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>S3 OS – Win95 redesigned</title>
<style>
:root{--desk1:#1d3b4a;--desk2:#2f6f73;--face:#e6e3dc;--ink:#1c1f24;--hi:#fff;--lo:#9a968c;--acc:#3b4fd8;--acc2:#6d7cf2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;font:13px/1.3 "Segoe UI",Tahoma,Verdana,sans-serif;color:var(--ink);user-select:none}
body{background:linear-gradient(160deg,var(--desk1),var(--desk2));background-attachment:fixed}
#desk{position:absolute;inset:0 0 40px 0;padding:14px;display:grid;grid-template-columns:repeat(auto-fill,78px);grid-auto-rows:84px;gap:6px;align-content:start;justify-content:start;writing-mode:vertical-lr}
.ico{writing-mode:horizontal-tb;display:flex;flex-direction:column;align-items:center;gap:4px;color:#fff;padding:6px 2px;border-radius:4px;cursor:default;text-align:center;font-size:12px;border:1px solid transparent;background:none;font-family:inherit}
.ico span{font-size:28px;line-height:1}
.ico:hover,.ico:focus-visible{background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.4);outline:none}
.win{position:absolute;background:var(--face);border-radius:6px 6px 2px 2px;box-shadow:inset 1px 1px var(--hi),inset -1px -1px var(--lo),0 8px 24px rgba(0,0,0,.35);border:1px solid #55524a;display:flex;flex-direction:column;min-width:240px;min-height:140px}
.win.max{inset:0 0 40px 0!important;width:auto!important;height:auto!important;border-radius:0}
.tb{display:flex;align-items:center;gap:6px;padding:4px 4px 4px 8px;background:linear-gradient(90deg,#8a93a6,#aab1c1);color:#fff;border-radius:5px 5px 0 0;cursor:move;font-weight:600}
.win.act .tb{background:linear-gradient(90deg,var(--acc),var(--acc2))}
.tb b{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-weight:600}
.tb button{width:22px;height:20px;border:0;border-radius:3px;background:rgba(255,255,255,.22);color:#fff;font:700 12px/1 inherit;cursor:pointer}
.tb button:hover{background:rgba(255,255,255,.4)}.tb button.x:hover{background:#d8453b}
.body{flex:1;overflow:auto;margin:3px;background:#fff;border:1px solid var(--lo);border-radius:2px;user-select:text;position:relative}
.menu{display:flex;gap:2px;padding:2px 6px;font-size:12px}.menu span{padding:2px 8px;border-radius:3px}.menu span:hover{background:#d3d0c7}
.btn{background:var(--face);border:1px solid #55524a;border-radius:3px;box-shadow:inset 1px 1px var(--hi),inset -1px -1px var(--lo);font:inherit;padding:5px 10px;cursor:pointer;color:var(--ink)}
.btn:active{box-shadow:inset 1px 1px var(--lo)}
#task{position:absolute;left:0;right:0;bottom:0;height:40px;background:var(--face);border-top:1px solid var(--hi);box-shadow:0 -2px 10px rgba(0,0,0,.25);display:flex;align-items:center;gap:6px;padding:4px 6px;z-index:9999}
#start{font-weight:700;display:flex;gap:6px;align-items:center;padding:4px 12px}
#tabs{flex:1;display:flex;gap:4px;overflow:hidden}
.tab{max-width:160px;min-width:60px;flex:1;text-align:left;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.tab.on{box-shadow:inset 1px 1px var(--lo);background:#f4f2ec;font-weight:600}
#clock{padding:4px 10px;border:1px solid var(--lo);border-radius:3px;box-shadow:inset 1px 1px var(--lo);font-size:12px;min-width:64px;text-align:center}
#sm{position:absolute;left:6px;bottom:44px;width:250px;background:var(--face);border:1px solid #55524a;border-radius:6px;box-shadow:0 10px 30px rgba(0,0,0,.4);display:none;z-index:10000;overflow:hidden}
#sm.open{display:flex}
#sm .side{width:34px;background:linear-gradient(0deg,var(--acc),#1d2a82);color:#fff;writing-mode:vertical-rl;transform:rotate(180deg);padding:10px 6px;font-weight:700;letter-spacing:.5px}
#sm ul{list-style:none;margin:0;padding:4px;flex:1}
#sm li button{width:100%;display:flex;gap:10px;align-items:center;border:0;background:none;padding:8px 10px;font:inherit;text-align:left;border-radius:4px;cursor:pointer}
#sm li button:hover{background:var(--acc);color:#fff}
#sm hr{border:0;border-top:1px solid var(--lo);margin:4px 6px}
.files{display:grid;grid-template-columns:repeat(auto-fill,76px);gap:8px;padding:10px}
.files div{text-align:center;font-size:12px;padding:6px;border-radius:4px}.files div:hover{background:#dfe4ff}.files span{display:block;font-size:26px}
textarea{width:100%;height:100%;border:0;resize:none;padding:8px;font:13px/1.5 Consolas,monospace;outline:none}
.calc{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:8px;background:var(--face);min-height:100%}
.calc output{grid-column:1/-1;background:#fff;border:1px solid var(--lo);padding:8px;text-align:right;font:22px Consolas,monospace;min-height:44px;overflow:hidden}
.set{padding:12px;display:grid;gap:12px}.sw{display:flex;gap:8px}.sw button{width:34px;height:34px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #55524a;cursor:pointer}
.mine{display:grid;grid-template-columns:repeat(9,26px);gap:2px;padding:10px;justify-content:center}
.mine button{width:26px;height:26px;padding:0;font-weight:700}
@media (prefers-reduced-motion:no-preference){.win{animation:pop .12s ease-out}@keyframes pop{from{transform:scale(.96);opacity:0}}}
@media (max-width:600px){.win:not(.max){width:92vw!important;left:4vw!important}}
#boot,#login{position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;color:#fff;background:#0b1118}
#login{background:linear-gradient(160deg,var(--desk1),var(--desk2));display:none}
#boot h1{font:700 44px/1 "Segoe UI",sans-serif;margin:0;letter-spacing:2px}
#bar{width:260px;height:10px;border:1px solid #556;border-radius:5px;overflow:hidden}
#bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .35s}
#bmsg{font:12px Consolas,monospace;color:#9fb0c3;min-height:16px}
#login .av{width:84px;height:84px;border-radius:50%;background:rgba(255,255,255,.2);display:grid;place-items:center;font-size:40px}
#login input{padding:8px 12px;border-radius:4px;border:1px solid #55524a;font:inherit;width:220px}
</style></head><body>
<div id="boot"><h1>S3 OS</h1><div id="bar"><i></i></div><div id="bmsg"></div></div>
<div id="login"><div class="av">👤</div><b style="font-size:18px">User</b><input id="pw" type="password" placeholder="Password (any)" aria-label="Password"><button class="btn" id="go">Sign in</button></div>
<div id="desk"></div>
<div id="sm"><div class="side">S3 OS</div><ul id="smList"></ul></div>
<div id="task"><button class="btn" id="start" aria-label="Start menu">◆ Start</button><div id="tabs"></div><div id="clock"></div></div>
<script>
var APPS={
files:{t:'My Computer',i:'🗂️',w:420,h:300,r:function(b){var d=[['Documents','📁'],['Pictures','🖼️'],['Downloads','📥'],['Local Disk (C:)','💽'],['Network','🌐'],['Recycle Bin','🗑️']];b.innerHTML='<div class="files">'+d.map(function(x){return '<div><span>'+x[1]+'</span>'+x[0]+'</div>'}).join('')+'</div>'}},

'C ⌫ % ÷ 7 8 9 × 4 5 6 − 1 2 3 + 0 . ( = '.split(' ').slice(0,20).forEach(function(k){var e=document.createElement('button');e.className='btn';e.textContent=k;e.onclick=function(){
if(k=='C')s='';else if(k=='⌫')s=s.slice(0,-1);else if(k=='='){try{s=String(Function('"use strict";return ('+s.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/%/g,'/100')+')')());}catch(e){s=''}}else s+=k;o.textContent=s||'0'};c.appendChild(e)})}},
mine:{t:'Minesweeper',i:'💣',w:320,h:340,r:function(b){var n=9,m=10,g,op,over;function init(){g=[];op=[];over=0;for(var i=0;i<81;i++){g.push(0);op.push(0)}var k=0;while(k<m){var p=Math.floor(Math.random()*81);if(!g[p]){g[p]=1;k++}}draw()}

for(var i=0;i<81;i++)(function(i){var e=document.createElement('button');e.className='btn';if(op[i]||over){e.style.background='#f4f2ec';e.textContent=g[i]?'💥':(nb(i)||'')}e.onclick=function(){if(over)return;if(g[i]){over=1}else open(i);draw();if(over)b.querySelector('span').textContent='Boom. Try again.'};f.appendChild(e)})(i);b.querySelector('.btn:last-of-type').onclick=init}init()}},
set:{t:'Control Panel',i:'⚙️',w:340,h:250,r:function(b){b.innerHTML='<div class="set"><div><b>Accent colour</b><div class="sw"></div></div><div><b>Desktop</b><div class="sw" id="dk"></div></div></div>';
[['#3b4fd8','#6d7cf2'],['#0e8a6a','#3cc3a0'],['#c2410c','#f08a4b'],['#a21caf','#d77be3']].forEach(function(c){var e=document.createElement('button');e.style.background=c[0];e.setAttribute('aria-label','Accent '+c[0]);e.onclick=function(){document.documentElement.style.setProperty('--acc',c[0]);document.documentElement.style.setProperty('--acc2',c[1])};b.querySelector('.sw').appendChild(e)});
[['#1d3b4a','#2f6f73'],['#2b2340','#6b3f6e'],['#1f2a1f','#4d6b3a'],['#111827','#374151']].forEach(function(c){var e=document.createElement('button');e.style.background='linear-gradient(135deg,'+c[0]+','+c[1]+')';e.setAttribute('aria-label','Desktop theme');e.onclick=function(){document.documentElement.style.setProperty('--desk1',c[0]);document.documentElement.style.setProperty('--desk2',c[1])};b.querySelector('#dk').appendChild(e)})}},
web:{t:'Browser',i:'🌐',w:680,h:460,r:function(b){
var H=[],p=-1,home=`<body style="font:15px Segoe UI,sans-serif;display:grid;place-items:center;height:90vh;margin:0;background:#f6f5f1;color:#1c1f24"><div style="text-align:center"><h2>S3 Browser</h2><p>Type an address or a search above, or start here:</p><button data-u="https://en.wikipedia.org" onclick="parent.postMessage(this.dataset.u,'*')">Wikipedia</button> <button data-u="https://www.openstreetmap.org" onclick="parent.postMessage(this.dataset.u,'*')">OpenStreetMap</button></div></body>`;
b.style.cssText='display:flex;flex-direction:column;user-select:auto';
b.innerHTML=`<div style="display:flex;gap:4px;padding:6px;background:var(--face)"><button class="btn" aria-label="Back">◀</button><button class="btn" aria-label="Forward">▶</button><button class="btn" aria-label="Reload">⟳</button><button class="btn" aria-label="Home">⌂</button><input aria-label="Address" placeholder="Search or enter address" style="flex:1;min-width:0;padding:4px 8px;border:1px solid #55524a;border-radius:3px;font:inherit"><button class="btn" title="Open in a new window" aria-label="Open in a new window">↗</button></div><iframe title="Page" style="flex:1;border:0;width:100%;background:#fff"></iframe>`;
var q=b.querySelectorAll('button'),inp=b.querySelector('input'),fr=b.querySelector('iframe');
function url(s){s=s.trim();if(!s)return '';if(s.indexOf('http')==0)return s;if(s.indexOf(' ')<0&&s.indexOf('.')>0)return 'https://'+s;return 'https://www.google.com/search?q='+encodeURIComponent(s)}
function show(u){if(!u){fr.removeAttribute('src');fr.srcdoc=home;inp.value=''}else{fr.removeAttribute('srcdoc');fr.src=u;inp.value=u}}
function go(u){H=H.slice(0,p+1);H.push(u);p=H.length-1;show(u)}
q[0].onclick=function(){if(p>0)show(H[--p])};
q[1].onclick=function(){if(p<H.length-1)show(H[++p])};
q[2].onclick=function(){show(H[p]||'')};
q[3].onclick=function(){go('')};
q[4].onclick=function(){var u=url(inp.value)||H[p];if(u)window.open(u,'_blank')};
inp.onkeydown=function(e){if(e.key=='Enter'){var u=url(inp.value);if(!u)return;if(u.indexOf('https://www.google.com/search')==0)window.open(u,'_blank');else go(u)}};
window.addEventListener('message',function(e){if(e.source===fr.contentWindow&&typeof e.data=='string'&&e.data.indexOf('https:')==0)go(e.data)});
go('')}},
about:{t:'About S3 OS',i:'ℹ️',w:300,h:190,r:function(b){b.innerHTML='<div style="padding:16px"><b style="font-size:16px">S3 OS</b><p>A calmer take on the 1995 desktop: the same Start button, taskbar and windows, with softer edges and room to breathe.</p></div>'}}
};
/* ---- real file system, settings, notepad, browser notice ---- */
var FS=(function(){try{var d=JSON.parse(localStorage.getItem('s3fs'));if(d)return d}catch(e){}return {Documents:{'Welcome.txt':'Welcome to S3 OS. Create files and folders in My Computer.'},Pictures:{},Downloads:{},Desktop:{}}})();
function saveFS(){try{localStorage.setItem('s3fs',JSON.stringify(FS))}catch(e){}}
var CFG=(function(){try{var d=JSON.parse(localStorage.getItem('s3cfg'));if(d)return d}catch(e){}return {}})();
function saveCfg(){try{localStorage.setItem('s3cfg',JSON.stringify(CFG))}catch(e){}}
function applyCfg(){var r=document.documentElement.style;if(CFG.a){r.setProperty('--acc',CFG.a[0]);r.setProperty('--acc2',CFG.a[1])}if(CFG.d){r.setProperty('--desk1',CFG.d[0]);r.setProperty('--desk2',CFG.d[1])}document.body.style.fontSize=(CFG.f||13)+'px'}
applyCfg();
tick=function(){document.getElementById('clock').textContent=new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit',hour12:!CFG.h})};
var NA=null;
function node(p){var n=FS;for(var i=0;i<p.length;i++)n=n[p[i]];return n}
function esc(s){return String(s).split('&').join('&amp;').split('<').join('&lt;')}
var sty=document.createElement('style');sty.textContent='.menu{display:none}.files div.sel{background:#cfd6ff}';document.head.appendChild(sty);
APPS.files={t:'My Computer',i:'🗂️',w:480,h:360,r:function(b){
var path=[],sel='',mode='',ks=[];b.style.cssText='display:flex;flex-direction:column;user-select:none';
function mark(){[].forEach.call(b.querySelectorAll('[data-i]'),function(e){e.className=ks[+e.dataset.i]==sel?'sel':''})}
function draw(){var n=node(path);ks=Object.keys(n).sort(function(a,c){var da=typeof n[a]=='object',dc=typeof n[c]=='object';return da==dc?(a<c?-1:1):(da?-1:1)});
var it='';ks.forEach(function(k,i){it+=`<div data-i='${i}'><span>${typeof n[k]=='object'?'📁':'📄'}</span>${esc(k)}</div>`});
b.innerHTML=`<div style='display:flex;gap:4px;padding:6px;flex-wrap:wrap;background:var(--face)'><button class='btn' data-c='up'>⬆ Up</button><button class='btn' data-c='folder'>New folder</button><button class='btn' data-c='file'>New file</button><button class='btn' data-c='ren'>Rename</button><button class='btn' data-c='del'>Delete</button></div><div style='padding:4px 8px;background:#f4f2ec;border-bottom:1px solid var(--lo)'>This PC${path.map(function(p){return ' › '+esc(p)}).join('')}</div>`+(mode?`<div style='display:flex;gap:4px;padding:6px'><input id='nm' aria-label='Name' placeholder='Name' style='flex:1;min-width:0;padding:4px 8px;border:1px solid #55524a;border-radius:3px;font:inherit'><button class='btn' data-c='ok'>OK</button></div>`:'')+`<div class='files' style='flex:1;overflow:auto;align-content:start'>${it||'<i style="padding:8px">This folder is empty</i>'}</div>`;mark()}
function ok(){var nm=document.getElementById('nm').value.trim().split('/').join(''),n=node(path);if(nm&&!(nm in n)){if(mode=='folder')n[nm]={};else if(mode=='file')n[nm]='';else if(sel){n[nm]=n[sel];delete n[sel];sel=nm}saveFS()}mode='';draw()}
b.onclick=function(e){var t=e.target.closest('[data-c]'),f=e.target.closest('[data-i]');
if(f){sel=ks[+f.dataset.i];mark();return}
if(!t)return;var c=t.dataset.c;
if(c=='up'){path.pop();sel='';mode=''}else if(c=='del'){if(sel){delete node(path)[sel];sel='';saveFS()}mode=''}else if(c=='ok'){ok();return}else if(c=='ren'&&!sel)return;else mode=c;
draw();var i=document.getElementById('nm');if(i){i.focus();if(c=='ren')i.value=sel}};
b.ondblclick=function(e){var f=e.target.closest('[data-i]');if(!f)return;var k=ks[+f.dataset.i];if(typeof node(path)[k]=='object'){path.push(k);sel='';mode='';draw()}else{NA={path:path.slice(),name:k};launch(k.slice(-4)=='.doc'?'word':k.slice(-6)=='.sheet'?'excel':k.slice(-7)=='.slides'?'ppt':'note')}};
b.onkeydown=function(e){if(e.key=='Enter'&&e.target.id=='nm')ok()};
draw()}};

b.style.cssText='display:flex;flex-direction:column;user-select:auto';
b.innerHTML=`<div style='display:flex;gap:4px;padding:6px;background:var(--face)'><input style='flex:1;min-width:0;padding:4px 8px;border:1px solid #55524a;border-radius:3px;font:inherit' placeholder='File name, e.g. notes.txt' aria-label='File name'><button class='btn'>Save</button><span style='align-self:center;font-size:12px'></span></div><textarea spellcheck='false' placeholder='Start typing…' style='flex:1;height:auto'></textarea>`;
var inp=b.querySelector('input'),ta=b.querySelector('textarea'),st=b.querySelector('span');if(f){inp.value=f.name;ta.value=node(path)[f.name]||''}

APPS.set={t:'Control Panel',i:'⚙️',w:380,h:400,r:function(b){
var A=[['#3b4fd8','#6d7cf2'],['#0e8a6a','#3cc3a0'],['#c2410c','#f08a4b'],['#a21caf','#d77be3']],D=[['#1d3b4a','#2f6f73'],['#2b2340','#6b3f6e'],['#1f2a1f','#4d6b3a'],['#111827','#374151']];
b.innerHTML=`<div class='set'><div><b>Accent colour</b><div class='sw' id='sa'></div></div><div><b>Desktop theme</b><div class='sw' id='sd'></div></div><div><b>Text size</b><br><input type='range' min='11' max='18' value='${CFG.f||13}' aria-label='Text size' style='width:100%'></div><div><b>Clock</b><br><label><input type='checkbox' id='h24'> 24-hour clock</label></div><div><b>System</b><div id='info' style='font-size:12px;line-height:1.6'></div></div></div>`;
A.forEach(function(c){var e=document.createElement('button');e.style.background=c[0];e.setAttribute('aria-label','Accent '+c[0]);e.onclick=function(){CFG.a=c;saveCfg();applyCfg()};b.querySelector('#sa').appendChild(e)});
D.forEach(function(c){var e=document.createElement('button');e.style.background='linear-gradient(135deg,'+c[0]+','+c[1]+')';e.setAttribute('aria-label','Desktop theme');e.onclick=function(){CFG.d=c;saveCfg();applyCfg()};b.querySelector('#sd').appendChild(e)});

b.querySelector('#info').innerHTML='Screen: '+screen.width+'×'+screen.height+'<br>CPU threads: '+(navigator.hardwareConcurrency||'unknown')+'<br>Memory: '+(navigator.deviceMemory?navigator.deviceMemory+' GB':'unknown')+'<br>Network: '+(navigator.onLine?'online':'offline')+'<br>S3 OS version 0.3'}};
var ow=APPS.web.r;APPS.web.r=function(b){ow(b);b.insertAdjacentHTML('beforeend',`<div style='padding:4px 8px;font-size:12px;background:var(--face);border-top:1px solid var(--lo)'>Page blank? Many sites refuse to load inside another page. Press ↗ to open it in a full browser window.</div>`)};
/* ---- office apps ---- */
//PURE
var CT=(function(){var t=[];for(var n=0;n<256;n++){var c=n;for(var k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc(u){var c=0xFFFFFFFF;for(var i=0;i<u.length;i++)c=CT[(c^u[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0}
async function pipe(u,S){var s=new Blob([u]).stream().pipeThrough(S);return new Uint8Array(await new Response(s).arrayBuffer())}
function deflate(u){return pipe(u,new CompressionStream('deflate-raw'))}
